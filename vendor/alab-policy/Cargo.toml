# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 Andrew Yates
# Written by `targo --unverified verify vendor-out` from aterm's crates/alab-policy/Cargo.toml: rerun it there, never
# edit this copy (../VENDORED holds each file's digest).

[package]
name = "alab-policy"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Andrew Yates"]
description = "The turn-end readers an ALab harness judges an agent's reply with: needs, credentials, Land's check, the go-ahead, Cruise's carry, the press guard, whether a shell command only reads, the words each act types, the phase, wall and reset vocabulary a screen reader reports in, and the policy keys and timings it decides under; std only"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

# The copy's one target. Its tests and doctests run in aterm, beside the files
# they read.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[lints.clippy]
all = { level = "warn", priority = -1 }
ignore_without_reason = "warn"

[lints.rust]
unexpected_cfgs = { check-cfg = ["cfg(trust_verify)", "cfg(trust_seals)", "cfg(trust_binding)"], level = "warn" }
unsafe_op_in_unsafe_fn = "warn"

[dependencies]
