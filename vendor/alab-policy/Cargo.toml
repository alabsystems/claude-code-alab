# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 Andrew Yates
# Written by `targo --unverified verify vendor-out` from aterm's vendor/alab-harness/crates/alab-policy/Cargo.toml: rerun it there, never
# edit this copy (../VENDORED holds each file's digest).

[package]
name = "alab-policy"
version = "0.8.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Andrew Yates"]
description = "The turn-end readers an ALab harness judges an agent's reply with: needs, credentials, Land's check, the go-ahead, Cruise's carry, the press guard, whether a shell command only reads, the words each act types, the phase, wall and reset vocabulary a screen reader reports in, the policy keys and timings it decides under, the machine's sleeps inside a turn's done row, the git-config hazard check and Claude Code's shell startup; std only"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

# The copy's one target. Its tests and doctests run in the repository aterm
# vendors it from (the workspace of aterm's vendor/alab-harness/Cargo.toml), beside the files they read.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[lints.clippy]
ignore_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
