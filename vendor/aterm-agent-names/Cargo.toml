# Copyright 2026 Andrew Yates
# Written by `targo --unverified verify vendor-out` from aterm's crates/aterm-agent-names/Cargo.toml: rerun it there, never
# edit this copy (../VENDORED holds each file's digest).

[package]
name = "aterm-agent-names"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Andrew Yates"]
description = "aterm — the one agent name table: which coding agent a program's name names (`agent_of`), its product name, and the runtimes an agent runs under. No screen reader: aterm-phase maps it onto its readers, and a crate deny.toml keeps from the reader (aterm-machines' console presence) names an agent by it."
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

# The copy's one target. Its tests and doctests run in aterm, beside the files
# they read.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[lints.clippy]
all = { level = "warn", priority = -1 }
ignore_without_reason = "warn"

[lints.rust]
unexpected_cfgs = { check-cfg = ["cfg(trust_verify)", "cfg(trust_seals)", "cfg(trust_binding)"], level = "warn" }
unsafe_op_in_unsafe_fn = "warn"

[dependencies]
