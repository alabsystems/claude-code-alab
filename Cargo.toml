# SPDX-License-Identifier: Apache-2.0
#
# claude-code-alab: the ALab harness for Claude Code. One package, one binary,
# `claude-alab`, which runs the UNMODIFIED vendor `claude` from the atpkg store
# as its child (README.md).
#
# The ONE release version source is `[workspace.package] version` below:
# `pub version`/`pub bump` read and move it, and the atpkg pack reads it.
# The binary reports that MAJOR.MINOR.0 line, optionally with the pack's
# ALAB_HARNESS_VERSION +g<sha> build stamp; patch is always 0.

[workspace]
# vendor/ has two producers (docs/DECISIONS.md, 41): the canonical tagged
# alab-harness tree and aterm's sealed phase/name projections. They are path
# dependencies, never workspace members; pin and projection checks hold each
# to its own producer. Package-scoped checks leave their own tests to their owners.
# No `members` key: this package is the one member anyway, and an explicit
# `members = ["."]` names every path under the root, which overrides
# `exclude` and made the copies members.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Andrew Yates"]
repository = "https://github.com/alabsystems/claude-code-alab"

# The one tool this package exposes on PATH through atpkg. It is never named
# like the vendor's own command (`claude`): that name belongs to the vendor
# row's shim and the `agents/` twin.
[workspace.metadata.atpkg]
expose = ["claude-alab"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[package]
name = "claude-code-alab"
description = "ALab harness for Claude Code: runs the unmodified vendor CLI from the atpkg store and updates it underneath itself"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "claude-alab"
path = "src/main.rs"

[lib]
name = "claude_code_alab"
path = "src/lib.rs"

# The fake-vendor integration suite runs its own `main`: the same test binary is
# laid into a private atpkg store as the vendor `claude` and dispatches on its
# environment (tests/harness.rs).
[[test]]
name = "harness"
path = "tests/harness.rs"
harness = false

# Signal transfer needs a genuinely single-threaded process on each side of exec.
[[test]]
name = "transfer"
path = "tests/transfer.rs"
harness = false

# Different immutable harness images and a continuing vendor under a private PTY.
[[test]]
name = "image"
path = "tests/image.rs"
harness = false

# PTY allocation forks only after proving a genuinely single-threaded process.
[[test]]
name = "inner_pty"
path = "tests/inner_pty.rs"
harness = false

# The owned SDK channel forks only from a genuinely single-threaded qualifier.
[[test]]
name = "sdk_permission"
path = "tests/sdk_permission.rs"
harness = false

[[test]]
name = "interactive_permission"
path = "tests/interactive_permission.rs"
harness = false

# Explicit private no-model workspace-trust experiment, using the same native operation.
[[test]]
name = "folder_trust"
path = "tests/folder_trust.rs"
harness = false

[dependencies]
libc = "0.2"
# Shared harness policy and link come from the canonical tagged tree.
alab-policy = { path = "vendor/alab-harness/crates/alab-policy" }
alab-wire = { path = "vendor/alab-harness/crates/alab-wire" }
# aterm's screen reader and the agent name table are sealed projections.
aterm-phase = { path = "vendor/aterm-phase" }

[dev-dependencies]
alab-wire = { path = "vendor/alab-harness/crates/alab-wire", features = ["fake"] }

[lints]
workspace = true
